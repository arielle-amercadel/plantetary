name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests, type-check, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Next.js generates global types such as LayoutProps, and they aren't committed to git.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
